name: CianCore Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: quote the whole list with single quotes — double quotes
          # inside the value get passed literally to sdkmanager and it
          # fails to find packages like '"platforms;android-34"'.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # sing-box v1.14.3's go.mod says 1.25.5; Go 1.27 breaks its
          # go:linkname to os.checkPidfdOnce at link time.
          go-version: "1.25"

      - name: Download official Xray-core AAR
        run: |
          mkdir -p app/libs
          # Official build from 2dust/AndroidLibXrayLite — do NOT substitute
          # with a self-built AAR (known 6x latency regression, 2026-10-17).
          curl -fSL -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.10/libv2ray.aar
          ls -lh app/libs/libv2ray.aar

      - name: Build sing-box libbox AAR from official source
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          git clone --depth 1 --branch v1.14.3 \
            https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          gomobile bind \
            -androidapi 24 \
            -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            -o /tmp/libbox.aar \
            ./experimental/libbox
          # Fix dual-Go-library conflict:
          # 1. Rename libgojni.so -> libboxjni.so (avoid mergeDebugNativeLibs conflict
          #    with libv2ray.aar's libgojni.so)
          # 2. Strip go/ Java classes from classes.jar (avoid dex duplicate with
          #    libv2ray.aar's copy; libbox classes use libv2ray's go.Seq at runtime)
          # 3. App loads libboxjni.so via System.loadLibrary("boxjni") before use
          cd /tmp
          rm -rf libbox_fix && mkdir libbox_fix && cd libbox_fix
          unzip -q /tmp/libbox.aar
          mv jni/arm64-v8a/libgojni.so jni/arm64-v8a/libboxjni.so
          mkdir -p classes && cd classes
          unzip -q ../classes.jar
          rm -rf go
          rm ../classes.jar
          zip -q -r ../classes.jar .
          cd ..
          rm -f /tmp/libbox.aar
          zip -q -r /tmp/libbox.aar .
          cp /tmp/libbox.aar $GITHUB_WORKSPACE/app/libs/libbox.aar
          ls -lh $GITHUB_WORKSPACE/app/libs/
          unzip -l $GITHUB_WORKSPACE/app/libs/libbox.aar | grep -E "so|go/" | head -10

      - name: Restore fixed debug keystore
        run: |
          # Every build must carry the same signature, or the APK won't
          # install over the previous version (signature mismatch).
          # The runner's auto-generated debug.keystore is NOT stable across
          # runs (it changed between v0.5.0 and v0.6.0), so decode our own
          # fixed keystore from secrets instead.
          echo "${{ secrets.CIANCORE_DEBUG_KEYSTORE_B64 }}" | base64 -d > /tmp/ciancore-debug.keystore
          echo "CIANCORE_KEYSTORE_PATH=/tmp/ciancore-debug.keystore" >> $GITHUB_ENV

      - name: Build debug APK (arm64-v8a)
        run: |
          # No gradle wrapper in the repo (binary jar can't be committed
          # via the file-push flow), so install Gradle directly.
          curl -fSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.7/bin:$PATH
          gradle assembleDebug --stacktrace

      - name: Verify signing certificate
        run: |
          ls app/build/outputs/apk/debug/
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/*.apk | grep -E "SHA-256 digest|Signer #1"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ciancore-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
