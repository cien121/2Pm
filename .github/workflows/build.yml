name: CianCore Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NOTE: quote the whole list with single quotes — double quotes
          # inside the value get passed literally to sdkmanager and it
          # fails to find packages like '"platforms;android-34"'.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # sing-box v1.14.3's go.mod says 1.25.5; Go 1.27 breaks its
          # go:linkname to os.checkPidfdOnce at link time.
          go-version: "1.25"

      - name: Download official Xray-core AAR
        run: |
          mkdir -p app/libs
          # Official build from 2dust/AndroidLibXrayLite — do NOT substitute
          # with a self-built AAR (known 6x latency regression, 2026-10-17).
          curl -fSL -o app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.10/libv2ray.aar
          ls -lh app/libs/libv2ray.aar

      - name: Build sing-box libbox AAR from official source
        run: |
          # sing-box publishes no official AAR; build experimental/libbox
          # from official source via gomobile (same method NekoBox uses).
          #
          # PERF WARNING (2026-10-17): self-built cores from this CI
          # environment showed ~6x latency vs official builds. If the
          # sing-box core feels slow, suspect the toolchain first and
          # compare against a known-good reference before blaming code.
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          git clone --depth 1 --branch v1.14.3 \
            https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          # Newer gomobile requires the tool directive in the module graph.
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          gomobile bind \
            -androidapi 24 \
            -trimpath \
            -ldflags='-s -w -buildid=' \
            -o /tmp/libbox.aar \
            ./experimental/libbox
          cp /tmp/libbox.aar $GITHUB_WORKSPACE/app/libs/libbox.aar
          ls -lh $GITHUB_WORKSPACE/app/libs/

      - name: Build debug APK (arm64-v8a)
        run: |
          # No gradle wrapper in the repo (binary jar can't be committed
          # via the file-push flow), so install Gradle directly.
          curl -fSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.7/bin:$PATH
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ciancore-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
